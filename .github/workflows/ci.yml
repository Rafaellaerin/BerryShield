name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/gateway}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x'}
      - run: go test ./...
      - run: go vet ./...
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: PYTHONPATH=services/reputation python -m unittest discover -s services/reputation/tests -p 'test_*.py'
      - run: python -m py_compile services/reputation/berry_reputation/*.py tools/berryctl.py tools/har_summarize.py redteam/runner.py
  typescript:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: packages/browser-sdk}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Instantiate prebuilt WASM probe
        run: node -e "const fs=require('fs'); WebAssembly.instantiate(fs.readFileSync('../../crates/probe-wasm/dist/probe.wasm'),{}).then(({instance})=>{if(typeof instance.exports.mix32!=='function')process.exit(1)})"
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path services/risk-engine/Cargo.toml
      - run: cargo test --manifest-path crates/probe-wasm/Cargo.toml
